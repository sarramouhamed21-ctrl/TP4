<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="todo-container">
        <h1 class="title">
            Liste à faire
            <img src="images/image.png" alt="Icône Todo List" class="todo-icon">
        </h1>
        <div class="input-container">
            <input type="text" id="taskInput" placeholder="Entre rune tache ">
            <button id="addBtn">Ajouter</button>
        </div>
        <ul id="taskList"></ul>
    </div>
    <script src="script.js"></script>
</body>


</html>
